name: Variables Workflow
on:
    push:
        branches:
            - master
    workflow_dispatch:
env:
    PYTHON_VERSION: 3.9
jobs:
    BUILD:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: set up python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
    BUILD_ON_JOBS:
        env:
            PYTHON_VERSION_jOBS: 3.11
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: set up python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ env.PYTHON_VERSION_JOBS }}
    BUILD_ON_STEPS:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: set up python
              env:
                  PYTHON_VERSION_STEPS: 3.12
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ env.PYTHON_VERSION_STEPS }}
            - name: print python version
              run: python --version      
